function loginView(mode='in'){ $('#app').innerHTML=`<div class="min-h-screen grid lg:grid-cols-2"><div class="hidden lg:flex p-14 flex-col justify-between bg-gradient-to-br from-blue-950 via-ink to-ink border-r border-line"><div class="flex items-center gap-3"><div class="w-10 h-10 rounded-xl bg-blue-500/20 border border-blue-400/30 grid place-items-center text-xl">✦</div><b class="text-lg">LeadRescue <span class="text-blue-400">AI</span></b></div><div class="max-w-lg"><span class="pill">YOUR PIPELINE, UNDER CONTROL</span><h1 class="text-5xl font-bold leading-tight mt-6">Every lead deserves a <span class="text-blue-400">second chance.</span></h1><p class="muted mt-5 text-lg leading-8">Keep conversations moving, spot follow-ups before they slip, and turn more opportunities into revenue.</p><div class="grid grid-cols-3 gap-3 mt-9"><div class="glass p-4 rounded-xl"><p class="text-2xl font-bold">01</p><p class="muted text-xs mt-2">Capture leads</p></div><div class="glass p-4 rounded-xl"><p class="text-2xl font-bold">02</p><p class="muted text-xs mt-2">Follow up</p></div><div class="glass p-4 rounded-xl"><p class="text-2xl font-bold">03</p><p class="muted text-xs mt-2">Win deals</p></div></div></div><p class="muted text-xs">© 2026 LeadRescue AI · Built for teams that follow through.</p></div><div class="flex items-center justify-center p-6"><form id="authForm" class="w-full max-w-md"><div class="lg:hidden flex items-center gap-3 mb-10"><div class="w-10 h-10 rounded-xl bg-blue-500/20 grid place-items-center text-xl">✦</div><b>LeadRescue <span class="text-blue-400">AI</span></b></div><p class="text-blue-400 text-sm font-semibold">${mode==='in'?'WELCOME BACK':'GET STARTED'}</p><h2 class="text-3xl font-bold mt-2">${mode==='in'?'Sign in to your workspace':'Create your workspace'}</h2><p class="muted mt-3 mb-8 text-sm">${mode==='in'?'Pick up where your team left off.':'A clearer pipeline starts here.'}</p>${mode==='up'?'<label class="block text-sm mb-2">Your name</label><input function shell(){const nav=[['Overview','◫'],['Leads','◎'],['Follow-ups','↻'],['Deals','◇'],['AI Assistant','✧'],['Settings','⚙']];$('#app').innerHTML=`<div class="min-h-screen lg:flex"><aside class="lg:w-64 lg:fixed lg:inset-y-0 p-4 border-b lg:border-b-0 lg:border-r border-line bg-[#0d1626] flex flex-col"><div class="flex items-center gap-3 px-3 py-3 mb-7"><div class="w-10 h-10 rounded-xl bg-blue-500/15 border border-blue-400/30 grid place-items-center text-xl">✦</div><div><p class="font-bold">LeadRescue <span class="text-blue-400">AI</span></p><p class="muted text-xs mt-1">Revenue workspace</p></div></div><p class="muted text-[10px] font-bold tracking-[.16em] px-3 mb-3">WORKSPACE</p><nav class="space-y-1">${nav.map(([n,i])=>`<button class="navbtn ${page===n?'active':''}" data-page="${n}"><span class="text-lg w-5 text-center">${i}</span>${n}${n==='Follow-ups'&&tasks.filter(t=>t.status==='pending').length?`<span class="ml-auto pill">${tasks.filter(t=>t.status==='pending').length}</span>`:''}</button>`).join('')}</nav><div class="mt-auto hidden lg:block"><div class="glass rounded-xl p-4 mb-4"><p class="text-sm font-semibold">Stay on top of it</p><p class="muted text-xs mt-2 leading-5">A timely follow-up can make the difference between a cold lead and a closed deal.</p><button class="text-blue-400 text-xs font-semibold mt-3" data-page="Follow-ups">Review follow-ups →</button></div><div class="flex items-center gap-3 px-2"><div class="w-9 h-9 rounded-full bg-blue-500/20 grid place-items-center font-bold">${esc((user.user_metadata?.full_name||user.email||'U').slice(0,1).toUpperCase())}</div><div class="min-w-0 flex-1"><p class="text-sm truncate">${esc(user.user_metadata?.full_name||user.email)}</p><p class="muted text-xs truncate">${esc(business?.name||'My workspace')}</p></div><button id="signout" class="muted" title="Sign out">↗</button></div></div></aside><main class="lg:ml-64 min-w-0 flex-1"><header class="h-[72px] border-b border-line flex items-center justify-between px-5 md:px-8"><div><p class="muted text-xs">Workspace / <span class="text-slate-200">${esc(page)}</span></p><h1 class="font-semibold text-lg mt-1">${esc(page)}</h1></div><div class="flex items-center gap-3"><span class="hidden sm:flex items-center gap-2 muted text-xs"><span class="dot"></span> Workspace connected</span><button class="btn" id="newLeadBtn">＋ Add lead</button></div></header><div id="content" class="p-5 md:p-8 max-w-[1500px] mx-auto"></div></main></div><div id="modalRoot"></div><div id="toast" class="hide"></div>`;document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{page=b.dataset.page;shell();renderPage()});$('#signout').onclick=async()=>{await db.auth.signOut();user=null;loginView()};$('#newLeadBtn').onclick=()=>leadModal();renderPage()}
function statusPill(s){const c={new:'text-blue-300 bg-blue-500/10',contacted:'text-amber-300 bg-amber-500/10',qualified:'text-violet-300 bg-violet-500/10',won:'text-emerald-300 bg-emerald-500/10',lost:'text-rose-300 bg-rose-500/10',no_response:'text-slate-300 bg-slate-500/10'};return `<span class="rounded-full px-2.5 py-1 text-[11px] font-semibold ${c[s]||c.new}">${esc((s||'new').replace('_',' '))}</span>`}

function renderPage(){const c=$('#content');if(!c)return;if(page==='Overview'){const won=leads.filter(x=>x.status==='won');const closed=leads.filter(x=>['won','lost'].includes(x.status));const overdue=tasks.filter(x=>x.status==='pending'&&new Date(x.due_at)<new Date());const rev=deals.filter(x=>x.status==='won').reduce((s,x)=>s+Number(x.actual_revenue||0),0);const recent=[...leads].slice(0,5);c.innerHTML=`<div class="flex flex-wrap justify-between gap-4 mb-7"><div><h2 class="text-2xl font-bold">Good to see you, ${esc((user.user_metadata?.full_name||user.email.split('@')[0]).split(' ')[0])} 👋</h2><p class="muted mt-2 text-sm">Here’s what’s happening across your pipeline today.</p></div><button id="refresh" class="px-3 py-2 rounded-lg border border-line text-sm muted hover:text-white">↻ Refresh data</button></div><div class="grid sm:grid-cols-2 xl:grid-cols-4 gap-4">${metric('Total leads',leads.length,'All tracked opportunities','◎')}${metric('Follow-ups overdue',overdue.length,overdue.length?'Needs your attention':'You’re all caught up','↻')}${metric('Conversion rate',closed.length?Math.round(won.length/closed.length*100)+'%':'—','Won / closed leads','↗')}${metric('Revenue recovered',money(rev),'From won deals','◇')}</div><div class="grid xl:grid-cols-3 gap-5 mt-6"><section class="glass rounded-2xl p-5 xl:col-span-2"><div class="flex items-center justify-between mb-4"><div><h3 class="font-semibold">Recent leads</h3><p class="muted text-xs mt-1">Your latest opportunities</p></div><button data-page="Leads" class="text-blue-400 text-sm">View all →</button></div>${recent.length?'<div class="overflow-x-auto"><table><thead><tr><th>Company</th><th>Status</th><th>Value</th><th>Added</th></tr></thead><tbody>'+recent.map(l=>`<tr><td><p class="font-semibold">${esc(l.company_name)}</p><p class="muted text-xs mt-1">${esc(l.contact_name||l.email||'No contact details')}</p></td><td>${statusPill(l.status)}</td><td>${money(l.estimated_value)}</td><td class="muted">${new Date(l.created_at).toLocaleDateString()}</td></tr>`).join('')+'</tbody></table></div>':'<div class="py-12 text-center"><div class="text-3xl">◎</div><p class="font-semibold mt-3">Your pipeline starts here</p><p class="muted text-sm mt-2">Add your first lead to start tracking opportunities.</p><button id="emptyAdd" class="btn mt-4">＋ Add your first lead</button></div>'}</section><section class="glass rounded-2xl p-5"><div class="flex items-center justify-between"><div><h3 class="font-semibold">Priority follow-ups</h3><p class="muted text-xs mt-1">Keep conversations moving</p></div><button data-page="Follow-ups" class="text-blue-400 text-sm">All →</button></div><div class="mt-4 space-y-3">${tasks.filter(t=>t.status==='pending').slice(0,5).map(t=>{const l=leads.find(x=>x.id===t.lead_id);return `<div class="p-3 rounded-xl border border-line bg-[#0b1424]"><div class="flex gap-2 items-start"><span class="mt-1 w-2 h-2 rounded-full ${new Date(t.due_at)<new Date()?'bg-rose-400':'bg-blue-400'}"></span><div class="min-w-0 flex-1"><p class="text-sm font-semibold">${esc(t.title)}</p><p class="muted text-xs mt-1">${esc(l?.company_name||'Lead')} · ${new Date(t.due_at).toLocaleDateString()}</p></div><button class="text-emerald-300" data-done="${t.id}" title="Complete">✓</button></div></div>`}).join('')||'<p class="muted text-sm py-10 text-center">No pending follow-ups. Nice work!</p>'}</div></section></div><div class="glass rounded-2xl p-5 mt-5"><h3 class="font-semibold">Pipeline health</h3><p class="muted text-xs mt-1 mb-5">Understand where opportunities stand</p><div class="grid sm:grid-cols-3 gap-4">${[['New',leads.filter(x=>x.status==='new').length,'#4f8cff'],['In conversation',leads.filter(x=>['contacted','qualified'].includes(x.status)).length,'#a78bfa'],['Won',won.length,'#38d9a9']].map(([n,v,col])=>`<div><div class="flex justify-between text-sm mb-2"><span class="muted">${n}</span><b>${v}</b></div><div class="h-2 rounded-full bg-[#26354d] overflow-hidden"><div class="h-full rounded-full" style="width:${leads.length?Math.max(3,v/leads.length*100):0}%;background:${col}"></div></div></div>`).join('')}</div></div>`;$('#refresh').onclick=loadData;$('#emptyAdd')?.addEventListener('click',()=>leadModal());document.querySelectorAll('[data-done]').forEach(b=>b.onclick=()=>completeTask(b.dataset.done));document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{page=b.dataset.page;shell();renderPage()});}
else if(page==='Leads'){const arr=leads.filter(l=>(filter==='all'||l.status===filter)&&[l.company_name,l.contact_name,l.email,l.phone].join(' ').toLowerCase().includes(search.toLowerCase()));c.innerHTML=`<div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-5"><div><h2 class="text-xl font-bold">Lead pipeline</h2><p class="muted text-sm mt-1">Manage contacts and move opportunities forward.</p></div><div class="flex gap-2"><input id="leadSearch" class="field md:w-56" placeholder="⌕ Search leads…" value="${esc(search)}"><select id="leadFilter" class="field md:w-40"><option value="all">All statuses</option>${['new','contacted','qualified','won','lost','no_response'].map(s=>`<option value="${s}" ${filter===s?'selected':''}>${s.replace('_',' ')}</option>`).join('')}</select></div></div><div class="glass rounded-2xl overflow-hidden"><div class="overflow-x-auto"><table><thead><tr><th>Company / contact</th><th>Status</th><th>Est. value</th><th>Next follow-up</th><th></th></tr></thead><tbody>${arr.map(l=>`<tr><td><p class="font-semibold">${esc(l.company_name)}</p><p class="muted text-xs mt-1">${esc(l.contact_name||'')}${l.email?' · '+esc(l.email):''}</p></td><td><select class="field !w-32 !py-1.5 !text-xs" data-status="${l.id}">${['new','contacted','qualified','won','lost','no_response'].map(s=>`<option value="${s}" ${l.status===s?'selected':''}>${s.replace('_',' ')}</option>`).join('')}</select></td><td>${money(l.estimated_value)}</td><td class="muted">${l.next_follow_up_at?new Date(l.next_follow_up_at).toLocaleDateString():'Not scheduled'}</td><td><button class="muted hover:text-rose-300" data-delete="${l.id}" title="Delete lead">⌫</button></td></tr>`).join('')||'<tr><td colspan="5" class="text-center py-12 muted">No matching leads. Add one to get started.</td></tr>'}</tbody></table></div><div class="p-4 border-t border-line muted text-xs">Showing ${arr.length} of ${leads.length} leads</div></div>`;$('#leadSearch').oninput=e=>{search=e.target.value;renderPage();const el=$('#leadSearch');el.focus();el.setSelectionRange(search.length,search.length)};$('#leadFilter').onchange=e=>{filter=e.target.value;renderPage()};document.querySelectorAll('[data-status]').forEach(s=>s.onchange=async()=>{const {error}=await db.from('leads').update({status:s.value,updated_at:new Date().toISOString()}).eq('id',s.dataset.status);if(error)toast(error.message,true);else{toast('Lead status updated');await loadData()}});document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=async()=>{if(!confirm('Delete this lead and its related follow-up records?'))return;const {error}=await db.from('leads').delete().eq('id',b.dataset.delete);if(error)toast(error.message,true);else{toast('Lead deleted');await loadData()}})}
else if(page==='Follow-ups'){const arr=tasks.filter(t=>t.status==='pending');c.innerHTML=`<div class="mb-5"><h2 class="text-xl font-bold">Follow-up center</h2><p class="muted text-sm mt-1">Small, consistent actions keep deals alive.</p></div><div class="grid sm:grid-cols-3 gap-4 mb-5">${metric('Pending',arr.length,'Open follow-up tasks','↻')}${metric('Overdue',arr.filter(t=>new Date(t.due_at)<new Date()).length,'Past their due date','!')}${metric('Completed',tasks.filter(t=>t.status==='completed').length,'Tasks finished','✓')}</div><div class="space-y-3">${arr.map(t=>{const l=leads.find(x=>x.id===t.lead_id);return `<div class="glass rounded-xl p-4 flex items-center gap-4"><div class="w-10 h-10 rounded-xl bg-blue-500/10 grid place-items-center text-blue-300">↻</div><div class="flex-1 min-w-0"><p class="font-semibold">${esc(t.title)}</p><p class="muted text-xs mt-1">${esc(l?.company_name||'Lead')} · Due ${new Date(t.due_at).toLocaleString()}</p></div><span class="pill">${esc(t.priority)}</span><button class="btn" data-done="${t.id}">Complete</button></div>`}).join('')||'<div class="glass rounded-2xl py-16 text-center"><p class="text-xl">✓</p><p class="font-semibold mt-3">You’re all caught up</p><p class="muted text-sm mt-2">Create a follow-up from a lead to see it here.</p></div>'}</div>`;document.querySelectorAll('[data-done]').forEach(b=>b.onclick=()=>completeTask(b.dataset.done))}
else if(page==='Deals'){const won=deals.filter(d=>d.status==='won'),open=deals.filter(d=>d.status==='open');c.innerHTML=`<div class="grid sm:grid-cols-3 gap-4 mb-6">${metric('Open deals',open.length,'Opportunities in progress','◇')}${metric('Pipeline value',money(open.reduce((s,d)=>s+Number(d.expected_value||0),0)),'Potential revenue','↗')}${metric('Won revenue',money(won.reduce((s,d)=>s+Number(d.actual_revenue||0),0)),'Closed successfully','✓')}</div><div class="glass rounded-2xl overflow-hidden"><div class="p-5 border-b border-line"><h3 class="font-semibold">Your deals</h3></div><div class="overflow-x-auto"><table><thead><tr><th>Deal</th><th>Lead</th><th>Expected</th><th>Actual</th><th>Status</th></tr></thead><tbody>${deals.map(d=>`<tr><td class="font-semibold">${esc(d.name)}</td><td>${esc(leads.find(l=>l.id===d.lead_id)?.company_name||'—')}</td><td>${money(d.expected_value)}</td><td>${d.actual_revenue==null?'—':money(d.actual_revenue)}</td><td>${statusPill(d.status)}</td></tr>`).join('')||'<tr><td colspan="5" class="muted text-center py-12">Won or qualified leads can become deals. Your deal list will appear here.</td></tr>'}</tbody></table></div></div>`}
else if(page==='AI Assistant'){c.innerHTML=`<div class="max-w-3xl"><div class="glass rounded-2xl p-6 md:p-8"><div class="w-12 h-12 rounded-2xl bg-blue-500/15 grid place-items-center text-2xl text-blue-300">✧</div><h2 class="text-2xl font-bold mt-5">Your follow-up copilot</h2><p class="muted mt-2 leading-6">Generate a tailored follow-up draft from your actual lead details. This runs locally in your workspace and does not send messages automatically.</p><label class="block text-sm mt-6 mb-2">Choose a lead</label><select id="aiLead" class="field">${leads.map(l=>`<option value="${l.id}">${esc(l.company_name)} — ${esc(l.status)}</option>`).join('')||'<option value="">Add a lead first</option>'}</select><label class="block text-sm mt-4 mb-2">Goal</label><select id="aiGoal" class="field"><option value="friendly check-in">Friendly check-in</option><option value="follow up after a proposal">Follow up after a proposal</option><option value="re-engage a quiet lead">Re-engage a quiet lead</option><option value="ask for a decision">Ask for a decision</option></select><button id="generateDraft" class="btn mt-5">✧ Generate follow-up draft</button><div id="draftBox" class="hide mt-6"><label class="block text-sm mb-2">Editable draft</label><textarea id="draftText" rows="8" class="field"></textarea><button id="copyDraft" class="btn mt-3">Copy draft</button></div></div><p class="muted text-xs mt-4">AI draft generation is a starter feature. External AI API integration is not configured, so this tool uses a template based on your lead information.</p></div>`;$('#generateDraft').onclick=()=>{const l=leads.find(x=>x.id===$('#aiLead').value);if(!l)return toast('Add a lead first',true);const goal=$('#aiGoal').value;$('#draftBox').classList.remove('hide');$('#draftText').value=`Subject: Quick follow-up — ${l.company_name}\n\nHi ${l.contact_name||'there'},\n\nI wanted to reach out with a ${goal} regarding ${l.company_name}. I know things get busy, so I wanted to see if you had any questions or if there is anything else I can share to help with next steps.\n\nWould a quick conversation this week be useful?\n\nBest,\n${user.user_metadata?.full_name||'Your name'}`;};$('#copyDraft').onclick=async()=>{await navigator.clipboard.writeText($('#draftText').value);toast('Draft copied')}}
else if(page==='Settings'){c.innerHTML=`<div class="max-w-2xl glass rounded-2xl p-6"><h2 class="text-xl font-bold">Workspace settings</h2><p class="muted text-sm mt-2">Manage your workspace details.</p><form id="settingsForm" class="mt-6"><label class="block text-sm mb-2">Workspace name</label><input class="field" name="name" required value="${esc(business?.name||'My workspace')}"><label class="block text-sm mt-4 mb-2">Industry</label><input class="field" name="industry" value="${esc(business?.industry||'')}" placeholder="e.g. Web design agency"><label class="block text-sm mt-4 mb-2">Website</label><input class="field" name="website" type="url" value="${esc(business?.website||'')}" placeholder="https://example.com"><button class="btn mt-5">Save settings</button></form><div class="border-t border-line mt-7 pt-5"><p class="font-semibold">Account</p><p class="muted text-sm mt-2">${esc(user.email)}</p><button id="signout2" class="mt-4 px-4 py-2 border border-line rounded-lg text-sm">Sign out</button></div></div>`;$('#settingsForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);const {error}=await db.from('businesses').update({name:f.get('name'),industry:f.get('industry'),website:f.get('website'),updated_at:new Date().toISOString()}).eq('id',business.id);if(error)toast(error.message,true);else{business={...business,name:f.get('name'),industry:f.get('industry'),website:f.get('website')};toast('Settings saved');shell()}};$('#signout2').onclick=async()=>{await db.auth.signOut();loginView()}}
}
function leadModal(){if(!business)return;$('#modalRoot').innerHTML=`<div class="fixed inset-0 z-40 bg-black/70 backdrop-blur-sm grid place-items-center p-4"><form id="leadForm" class="glass rounded-2xl p-6 w-full max-w-xl max-h-[92vh] overflow-y-auto"><div class="flex justify-between items-center mb-5"><div><h2 class="text-xl font-bold">Add a new lead</h2><p class="muted text-sm mt-1">Capture the details and keep the next step clear.</p></div><button type="button" id="closeModal" class="muted text-2xl">×</button></div><div class="grid sm:grid-cols-2 gap-4"><div><label class="block text-sm mb-2">Company name *</label><input name="company_name" required class="field" placeholder="Acme Studio"></div><div><label class="block text-sm mb-2">Contact name</label><input name="contact_name" class="field" placeholder="Jordan Lee"></div><div><label class="block text-sm mb-2">Email</label><input name="email" type="email" class="field" placeholder="jordan@company.com"></div><div><label class="block text-sm mb-2">Phone</label><input name="phone" class="field" placeholder="+1 555 0100"></div><div><label class="block text-sm mb-2">Estimated value (USD)</label><input name="estimated_value" type="number" min="0" step=".01" class="field" value="0"></div><div><label class="block text-sm mb-2">Lead source</label><select name="source" class="field"><option>Website</option><option>Referral</option><option>Social media</option><option>Cold outreach</option><option>Other</option></select></div><div><label class="block text-sm mb-2">Status</label><select name="status" class="field"><option value="new">New</option><option value="contacted">Contacted</option><option value="qualified">Qualified</option></select></div><div><label class="block text-sm mb-2">Follow-up date</label><input name="follow_up" type="date" class="field"></div><div class="sm:col-span-2"><label class="block text-sm mb-2">Notes</label><textarea name="notes" rows="3" class="field" placeholder="What do they need? What should happen next?"></textarea></div></div><p id="leadError" class="text-rose-400 text-sm mt-3"></p><div class="flex justify-end gap-3 mt-5"><button type="button" id="cancelLead" class="px-4 py-2 rounded-lg border border-line text-sm">Cancel</button><button class="btn" type="submit">Save lead</button></div></form></div>`;$('#closeModal').onclick=$('#cancelLead').onclick=()=>$('#modalRoot').innerHTML='';$('#leadForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);const row={business_id:business.id,company_name:f.get('company_name'),contact_name:f.get('contact_name')||null,email:f.get('email')||null,phone:f.get('phone')||null,estimated_value:Number(f.get('estimated_value')||0),source:f.get('source'),status:f.get('status'),notes:f.get('notes')||null,created_by:user.id,next_follow_up_at:f.get('follow_up')?new Date(f.get('follow_up')+'T12:00:00').toISOString():null};const btn=e.target.querySelector('button[type=submit]');btn.disabled=true;try{const {data,error}=await db.from('leads').insert(row).select().single();if(error)throw error;if(row.next_follow_up_at){const {error:te}=await db.from('follow_up_tasks').insert({business_id:business.id,lead_id:data.id,assigned_to:user.id,title:'Follow up with '+row.company_name,due_at:row.next_follow_up_at,priority:'medium'});if(te)toast('Lead saved; follow-up could not be created: '+te.message,true)}$('#modalRoot').innerHTML='';toast('Lead saved successfully');await loadData()}catch(x){$('#leadError').textContent=x.message||'Could not save lead.';btn.disabled=false}}}
async function completeTask(id){const {error}=await db.from('follow_up_tasks').update({status:'completed',completed_at:new Date().toISOString()}).eq('id',id);if(error)toast(error.message,true);else{toast('Follow-up completed');await loadData()}}
async function loadData(){if(!business)return;const [l,t,d]=await Promise.all([db.from('leads').select('*').eq('business_id',business.id).order('created_at',{ascending:false}),db.from('follow_up_tasks').select('*').eq('business_id',business.id).order('due_at',{ascending:true}),db.from('deals').select('*').eq('business_id',business.id).order('created_at',{ascending:false})]);const error=l.error||t.error||d.error;if(error){toast(error.message,true);return}leads=l.data||[];tasks=t.data||[];deals=d.data||[];renderPage()}
async function boot(){const {data,error}=await db.auth.getSession();if(error||!data.session){loginView();return}user=data.session.user;const {data:members,error:me}=await db.from('business_memberships').select('business_id, businesses(*)').eq('user_id',user.id).limit(1);if(me){loginView();$('#authError')&&($('#authError').textContent='Workspace setup failed: '+me.message);return}business=members?.[0]?.businesses||null;if(!business){const {data:id,error:ce}=await db.rpc('create_business_for_current_user',{business_name:(user.user_metadata?.full_name||user.email.split('@')[0])+"'s workspace"});if(ce){loginView();$('#authError')&&($('#authError').textContent='Could not set up workspace: '+ce.message);return}const {data:b,error:be}=await db.from('businesses').select('*').eq('id',id).single();if(be){loginView();$('#authError')&&($('#authError').textContent=be.message);return}business=b}shell();await loadData()}
db.auth.onAuthStateChange((_event,session)=>{if(session&&!user){boot()}else if(!session&&user){user=null;business=null;loginView()}});boot();
</script></body></html>
